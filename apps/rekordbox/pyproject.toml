[project]
name = "curator-rekordbox"
version = "0.1.0"
description = "Rekordbox master.db reader sidecar for the Curator desktop app."
requires-python = ">=3.10,<3.13"
dependencies = [
    # pyrekordbox: SQLCipher master.db reader + ANLZ parser + XML support.
    # MIT-licensed, supports rekordbox 6 + 7. See apps/analyzer/README.md for
    # the sidecar pattern this mirrors.
    "pyrekordbox >=0.4.4",
    "numpy >=1.26,<3",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/**/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/curator_rekordbox"]
