[versions]
agp = "9.5.2"
kotlin = "2.3.20"
composeBom = "2026.06.00"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
datastore = "1.1.7"
coroutines = "1.10.2"
serialization = "1.9.0"
# Hermes V1 at the version the sync-core spike measured; its JSI sources and
# hermesc are fetched at the same tag (scripts/fetch-vendor.mjs). fbjni at the
# version Hermes's own Android build names.
hermes = "260318099.0.8"
fbjni = "0.7.0"
junit = "4.13.2"
sqliteJdbc = "3.49.1.0"
gson = "2.11.0"
spotifyAuth = "2.1.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
hermes-android = { module = "com.facebook.hermes:hermes-android", version.ref = "hermes" }
fbjni = { module = "com.facebook.fbjni:fbjni", version.ref = "fbjni" }
junit = { module = "junit:junit", version.ref = "junit" }
# The list queries run against a real SQLite in unit tests (ListQueryTest).
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
spotify-auth = { module = "com.spotify.android:auth", version.ref = "spotifyAuth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
