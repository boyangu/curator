# Fly.io config for the cloud API. No `app =` here on purpose: the app name is
# a hosting identifier, kept out of the tree. scripts/release-cloud.mjs passes
# it as `--app` from CURATOR_FLY_APP in the maintainer's git-ignored .env
# (apps/cloud/README.md "Release"). Secrets go in with `fly secrets set`, never
# here.

# The region closest to the Supabase project: every request is a few
# Postgres round trips, which dominate latency.
primary_region = "<region>"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  # One machine stays up: the snapshot sweep runs on a timer inside it, and
  # a cold start would add seconds to the first push after idle.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/trpc/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # A snapshot build holds one user's whole library state in memory.
  memory = "512mb"
