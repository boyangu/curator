[package]
name = "engine-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike: the desktop's audio engine (apps/audio/src/engine.rs, unchanged) on Android's AAudio, measured. Not part of the product."

[[bin]]
name = "engine-probe"
path = "src/main.rs"

[dependencies]
# What the engine's own modules use, at the desktop's versions (Cargo.lock
# started as a copy of apps/audio's).
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["flac", "mp3", "wav", "aac", "isomp4", "vorbis", "ogg", "pcm"] }
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

# `cpal` here is the spike's stand-in: the few cpal types and traits the
# engine uses, over AAudio on Android and over a pull-by-hand renderer
# elsewhere. cpal's own Android backend needs a Java VM, which a program run
# from `adb shell` does not have.
cpal = { path = "cpal-standin", package = "curator-cpal-standin" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
