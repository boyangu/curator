# Production deploys of the cloud API (apps/cloud) to Fly.io. This is the
# only way a release reaches production (apps/cloud/README.md "Release"):
# from a `cloud-vX.Y.Z` tag on a commit that is already on main, after the
# same checks CI runs, through the `production` environment, which holds the
# one secret (FLY_API_TOKEN) and its protection rules. Nothing is deployed
# from a laptop or a working tree.
#
#   verify  resolve the tag, require its commit on main, run the cloud gate
#   deploy  (environment: production) build on Fly's remote builder from
#           that exact commit, then wait until /trpc/health reports it
#
# Migrations are not run here; the server refuses to boot on a database that
# lacks one (src/db/migration-gate.ts), so a release whose migrations were not
# applied fails its health check and the previous release keeps serving.
#
# Third-party actions are pinned by full commit SHA; the comment names the
# release. Dependabot (.github/dependabot.yml) proposes the bumps.

name: deploy-cloud

on:
  push:
    tags: ['cloud-v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy (cloud-vX.Y.Z); its commit must be on main
        required: true
        type: string

permissions:
  contents: read

# One production deploy at a time, and never cancel one halfway: a second
# release waits for the first to finish.
concurrency:
  group: deploy-cloud-production
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The tag arrives as a workflow input on a manual run, so it is checked
      # before it is used anywhere, and only ever reaches a shell via env.
      - name: Check the release tag
        id: name
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
        run: |
          TAG="${TAG#refs/tags/}"
          if ! [[ "$TAG" =~ ^cloud-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (cloud-vX.Y.Z)"
            exit 1
          fi
          # A manual run uses this workflow file from the ref it was started
          # on; only main's (reviewed) copy or a release tag's may deploy.
          if [ "$EVENT" = workflow_dispatch ] && [ "$RUN_REF" != refs/heads/main ] && [[ "$RUN_REF" != refs/tags/cloud-v* ]]; then
            echo "::error::start a manual deploy from main or a cloud-v* tag, not $RUN_REF"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Full history: the ancestry check below needs main's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.name.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on main
        id: commit
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          # ^{commit} peels an annotated tag; a branch of the same name does
          # not count.
          if ! SHA=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            echo "::error::$TAG is not a tag in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::$TAG ($SHA) is not on main; merge the change through a reviewed PR and tag the merge commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG at $SHA"

      - uses: ./.github/actions/cloud-check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers, the deployment branch/tag policy and FLY_API_TOKEN
    # live on this environment (README "One-time GitHub settings"). The Fly
    # app name is the FLY_APP repository variable, not a line in fly.toml:
    # the tree names no hosting identifier.
    environment: production
    env:
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - name: Require the FLY_APP repository variable
        run: |
          if [ -z "$FLY_APP" ]; then
            echo "::error::the FLY_APP repository variable is unset; set it to the Fly app name (gh variable set FLY_APP --body <app>, apps/cloud/README.md 'One-time GitHub settings')"
            exit 1
          fi
          if ! [[ "$FLY_APP" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::FLY_APP '$FLY_APP' is not a Fly app name (lowercase letters, digits, hyphens)"
            exit 1
          fi

      # The commit verify checked, by SHA: a tag moved after verify cannot
      # change what ships.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # flyctl itself is pinned too, not "latest"; bump it with the action.
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.118

      # --remote-only: the image is built on Fly's builder from this checkout
      # (the .dockerignore whitelist is the context), never on a laptop.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: >-
          flyctl deploy . --app "$FLY_APP" --config apps/cloud/fly.toml --dockerfile Dockerfile --remote-only
          --build-arg "GIT_SHA=$SHA" --image-label "$TAG"

      # flyctl waits for Fly's own health check; this proves the release
      # that answers is the commit just built (health.commit, from GIT_SHA),
      # not a machine still on the previous image.
      - name: Wait for health to report the deployed commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          URL="https://$FLY_APP.fly.dev/trpc/health"
          deadline=$((SECONDS + 180))
          while :; do
            got=$(curl -fsS --max-time 10 "$URL" 2>/dev/null | jq -r '.result.data.commit // empty' 2>/dev/null || true)
            if [ "$got" = "$SHA" ]; then
              echo "$URL reports $SHA"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$URL still reports '${got:-no answer}' after 3 minutes, expected $SHA"
              exit 1
            fi
            echo "health reports '${got:-no answer}', waiting for $SHA"
            sleep 10
          done
